services:
  api:
    build:
      context: ./api
    container_name: api
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - public
      - private

  db:
    image: postgres:16-alpine
    container_name: db
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

volumes:
  db_data:

networks:
  public:
  private: